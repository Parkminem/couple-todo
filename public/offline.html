<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>오프라인 · 우리의 할 일</title>
  <style>
    html { color-scheme: dark; }
    body { margin: 0; padding: 20px; box-sizing: border-box; min-height: 100dvh; display: grid; place-items: center; background: #101014; color: #f8f7fb; font: 16px/1.5 "Apple SD Gothic Neo", system-ui, sans-serif; }
    main { max-width: 320px; padding: 20px; border-radius: 18px; border: 1px solid #34313f; background: #1c1b24; }
    h1 { margin: 0; font-size: 24px; }
    p { color: #b1afbf; }
    a { display: inline-grid; place-items: center; min-height: 44px; border-radius: 12px; padding: 0 16px; background: #b89aff; color: #101014; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body><main><h1>인터넷 연결이 필요해요</h1><p>연결을 확인한 뒤에 우리의 할 일을 다시 열어 주세요.</p><a href="/">다시 열기</a></main></body>
</html>
