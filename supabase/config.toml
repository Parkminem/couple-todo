project_id = "couple-todo"

[auth]
site_url = "http://localhost:3000"
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "우리의 할 일 로그인 인증번호"
content_path = "./supabase/templates/otp.html"

[realtime]
enabled = true

[local_smtp]
enabled = true
port = 54324

[functions.dispatch-notifications]
verify_jwt = false
import_map = "./functions/dispatch-notifications/deno.json"
